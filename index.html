<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catbooks — Lector</title>

  <!-- JSZip: necessari per obrir els EPUB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>

  <!-- Epub.js -->
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f5f0e7;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* Zona de lectura */
    #reader-area {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Llibre */
    #reader {
      width: min(900px, calc(100vw - 180px));
      height: calc(100vh - 60px);
      background: white;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.12);
    }

    /* Botons de navegació */
    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);

      width: 54px;
      height: 80px;

      border: none;
      border-radius: 12px;

      background: rgba(255, 255, 255, 0.9);
      color: #59452f;

      font-family: Georgia, serif;
      font-size: 42px;
      line-height: 1;

      cursor: pointer;

      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
      
      z-index: 20;
    }

    .nav-button:hover {
      transform: translateY(-50%) scale(1.05);
      background: white;
    }

    .nav-button:active {
      transform: translateY(-50%) scale(0.97);
    }

    #prev {
      left: 28px;
    }

    #next {
      right: 28px;
    }

    /* Missatge de càrrega */
    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 30;

      background: white;
      color: #59452f;

      padding: 10px 18px;
      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    /* Adaptació a pantalles petites */
    @media (max-width: 700px) {

      #reader {
        width: calc(100vw - 70px);
        height: calc(100vh - 30px);
      }

      .nav-button {
        width: 38px;
        height: 60px;
        font-size: 30px;
        border-radius: 8px;
      }

      #prev {
        left: 8px;
      }

      #next {
        right: 8px;
      }
    }
  </style>
</head>

<body>

  <div id="message">
    Carregant el conte… 📖
  </div>

  <div id="reader-area">

    <button
      id="prev"
      class="nav-button"
      aria-label="Pàgina anterior">
      ‹
    </button>

    <div id="reader"></div>

    <button
      id="next"
      class="nav-button"
      aria-label="Pàgina següent">
      ›
    </button>

  </div>

  <script>

    // =====================================================
    // EL NOSTRE PRIMER CONTE DE PROVA
    // =====================================================

    const bookUrl =
      "https://raw.githubusercontent.com/cyrusashborn-hue/Catbooks/main/El%20cuinamots_Catbooks.epub";


    // =====================================================
    // OBRIM L'EPUB
    // =====================================================

    const book = ePub(bookUrl);


    // =====================================================
    // CREEM EL LECTOR
    // =====================================================

    const rendition = book.renderTo("reader", {

      width: "100%",
      height: "100%",

      spread: "none",

      flow: "paginated"

    });


    // =====================================================
    // MOSTREM EL LLIBRE
    // =====================================================

    rendition.display();


    // =====================================================
    // BOTÓ PÀGINA ANTERIOR
    // =====================================================

    document
      .getElementById("prev")
      .addEventListener("click", function () {

        rendition.prev();

      });


    // =====================================================
    // BOTÓ PÀGINA SEGÜENT
    // =====================================================

    document
      .getElementById("next")
      .addEventListener("click", function () {

        rendition.next();

      });


    // =====================================================
    // TECLAT
    // =====================================================

    document.addEventListener("keydown", function (event) {

      if (event.key === "ArrowLeft") {

        rendition.prev();

      }

      if (event.key === "ArrowRight") {

        rendition.next();

      }

    });


    // =====================================================
    // QUAN EL LLIBRE ESTÀ PREPARAT
    // =====================================================

    book.ready.then(function () {

      document
        .getElementById("message")
        .style.display = "none";

    });


  </script>

</body>
</html>
