<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catbooks - Lector en línia</title>

  <!-- Llibreries Epub.js i JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-body: #f4f6f8;
      --bg-header: #ffffff;
      --bg-viewer: #ffffff;
      --bg-drawer: #ffffff;
      --text-color: #222222;
      --border-color: #e1e8ed;
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-border: #cfd9de;
      --progress-bg: #e1e8ed;
      --progress-fill: #ff7b54;
      --hover-color: #fff2ed;
    }

    body.dark-mode {
      --bg-body: #121212;
      --bg-header: #1e1e1e;
      --bg-viewer: #1a1a1a;
      --bg-drawer: #1e1e1e;
      --text-color: #e4e6eb;
      --border-color: #333333;
      --btn-bg: rgba(40, 40, 40, 0.85);
      --btn-border: #444444;
      --progress-bg: #2a2a2a;
      --progress-fill: #ff9070;
      --hover-color: #2c2523;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      background: var(--bg-header);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      gap: 10px;
      z-index: 20;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand { font-size: 1.1rem; font-weight: bold; }

    #selector-llibre {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--btn-border);
      font-size: 0.9rem;
      background-color: var(--bg-header);
      color: var(--text-color);
      outline: none;
      cursor: pointer;
      max-width: 190px;
    }

    .tool-btn {
      background: var(--bg-header);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .tool-btn:hover {
      background: var(--btn-bg);
      border-color: #ff7b54;
    }

    #viewer-container {
      flex: 1;
      min-height: 0;
      position: relative;
      margin: 8px;
      background: var(--bg-viewer);
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 15;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #ff7b54;
      color: #ffffff;
      border-color: #ff7b54;
    }
    #prev { left: 10px; }
    #next { right: 10px; }

    /* Panell lateral de l'Índex */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      max-width: 80vw;
      height: 100%;
      background: var(--bg-drawer);
      color: var(--text-color);
      z-index: 60;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 0 15px rgba(0,0,0,0.2);
    }
    .drawer.active {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-header h3 { font-size: 1.05rem; }
    .btn-close-drawer {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-color);
      cursor: pointer;
      line-height: 1;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .toc-list { list-style: none; }
    .toc-item a {
      display: block;
      padding: 10px 18px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s;
    }
    .toc-item a:hover {
      background: var(--hover-color);
      color: #ff7b54;
    }

    footer {
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    #progress-track {
      flex: 1;
      height: 6px;
      background-color: var(--progress-bg);
      border-radius: 3px;
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background-color: var(--progress-fill);
      transition: width 0.3s ease;
    }

    #progress-text {
      min-width: 40px;
      text-align: right;
      color: var(--text-color);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      .nav-btn { width: 36px; height: 36px; font-size: 18px; opacity: 0.6; }
      #prev { left: 4px; }
      #next { right: 4px; }
      #viewer-container { margin: 4px; }
      #selector-llibre { max-width: 125px; font-size: 0.8rem; }
      .tool-btn { padding: 4px 7px; font-size: 0.8rem; }
    }

    #estat {
      position: absolute;
      font-size: 1rem;
      color: var(--text-color);
      text-align: center;
      padding: 20px;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Panell lateral lliscant per a l'Índex -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="index-drawer" class="drawer">
    <div class="drawer-header">
      <h3>Índex del conte</h3>
      <button id="btn-close-drawer" class="btn-close-drawer" aria-label="Tancar índex">&times;</button>
    </div>
    <div class="drawer-content">
      <ul id="toc-list" class="toc-list"></ul>
      <div id="toc-buit" style="display:none; padding: 20px; text-align: center; font-size: 0.9rem; color: #888;">
        Aquest conte no té índex de capítols.
      </div>
    </div>
  </div>

  <header>
    <div class="header-left">
      <div class="brand">Catbooks 🐾</div>
      <select id="selector-llibre"></select>
    </div>
    <div class="header-right">
      <button id="btn-open-toc" class="tool-btn" title="Índex de continguts">📑 Índex</button>
      <button id="btn-font-dec" class="tool-btn" title="Fer lletra més petita">A−</button>
      <button id="btn-font-inc" class="tool-btn" title="Fer lletra més gran">A+</button>
      <button id="btn-mode-nit" class="tool-btn" title="Mode nit">🌙</button>
    </div>
  </header>

  <div id="viewer-container">
    <div id="estat">Connectant amb els contes...</div>
    <div id="viewer"></div>
    <button id="prev" class="nav-btn" aria-label="Anterior">‹</button>
    <button id="next" class="nav-btn" aria-label="Següent">›</button>
  </div>

  <footer>
    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>
    <span id="progress-text">0%</span>
  </footer>

  <script>
    const llibres = [
      { titol: "El cuinamots", fitxer: "El cuinamots_Catbooks.epub" },
      { titol: "El mirall del cor", fitxer: "El mirall del cor_Catbooks.epub" },
      { titol: "L'alegria d'en Mixown", fitxer: "L'alegria d'en Mixown_Catbooks.epub" },
      { titol: "La bruixa Bruna", fitxer: "La bruixa Bruna_Catbooks.epub" },
      { titol: "La petita puça coixa", fitxer: "La petita puça coixa_Catbooks.epub" },
      { titol: "La troballa d'en Ganil", fitxer: "La troballa d'en Ganil_Catbooks.epub" },
      { titol: "Nit a la sabana", fitxer: "Nit a la sabana_Catbooks.epub" }
    ];

    const selector = document.getElementById('selector-llibre');
    const estat = document.getElementById('estat');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const tocList = document.getElementById('toc-list');
    const tocBuit = document.getElementById('toc-buit');
    const drawer = document.getElementById('index-drawer');
    const overlay = document.getElementById('drawer-overlay');

    let llibreActual = null;
    let rendition = null;
    let midaLletra = 100;
    let modeNit = false;

    llibres.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.fitxer;
      opt.textContent = item.titol;
      selector.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const parametreLlibre = params.get('llibre') || params.get('libro');

    if (parametreLlibre) {
      const trobat = llibres.find(l => l.fitxer.toLowerCase() === decodeURIComponent(parametreLlibre).toLowerCase());
      if (trobat) selector.value = trobat.fitxer;
    }

    // Funcions per obrir i tancar el panell de l'Índex
    function obrirIndex() {
      drawer.classList.add('active');
      overlay.classList.add('active');
    }
    function tancarIndex() {
      drawer.classList.remove('active');
      overlay.classList.remove('active');
    }

    document.getElementById('btn-open-toc').addEventListener('click', obrirIndex);
    document.getElementById('btn-close-drawer').addEventListener('click', tancarIndex);
    overlay.addEventListener('click', tancarIndex);

    async function obtenirArxiuBinari(nomFitxer) {
      const variantsNom = [nomFitxer, nomFitxer.normalize('NFD'), nomFitxer.normalize('NFC')];
      const nomsUnics = [...new Set(variantsNom)];
      const urlsAProvar = [];
      for (const nom of nomsUnics) {
        urlsAProvar.push("https://raw.githubusercontent.com/cyrusashborn-hue/Catbooks/main/" + encodeURI(nom));
        urlsAProvar.push("https://raw.githubusercontent.com/cyrusashborn-hue/Catbooks/main/" + encodeURIComponent(nom));
      }
      for (const url of urlsAProvar) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.arrayBuffer();
        } catch (e) {}
      }
      throw new Error("No s'ha pogut connectar amb el fitxer.");
    }

    // Funció per pintar els capítols de l'índex
    function carregarToc(items) {
      tocList.innerHTML = '';
      if (!items || items.length === 0) {
        tocBuit.style.display = 'block';
        return;
      }
      tocBuit.style.display = 'none';

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'toc-item';
        const a = document.createElement('a');
        a.textContent = item.label ? item.label.trim() : 'Capítol';
        a.href = '#';
        a.addEventListener('click', (e) => {
          e.preventDefault();
          if (rendition) {
            rendition.display(item.href);
            tancarIndex();
          }
        });
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    async function carregarLlibre(nomFitxer) {
      estat.style.display = 'block';
      estat.textContent = "Carregant conte...";
      progressFill.style.width = '0%';
      progressText.textContent = '0%';
      tocList.innerHTML = '';

      if (rendition) { try { rendition.destroy(); } catch (e) {} }
      if (llibreActual) { try { llibreActual.destroy(); } catch (e) {} }
      document.getElementById('viewer').innerHTML = '';

      try {
        const dadesBinaries = await obtenirArxiuBinari(nomFitxer);
        estat.textContent = "Preparant la lectura...";

        llibreActual = ePub();
        await llibreActual.open(dadesBinaries, "binary");

        const esMobil = window.innerWidth < 768;

        renditi
