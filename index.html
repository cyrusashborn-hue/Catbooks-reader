<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catbooks · Lector</title>
<meta name="description" content="Lee en línea los cuentos de Catbooks, gratis y sin registro.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --cream: #f7f0e3;
    --cream-deep: #efe4cf;
    --ink: #2e2a24;
    --ink-soft: #6b6255;
    --mustard: #e3a72e;
    --teal: #3e7c74;
    --line: #ddceac;
    --radius: 10px;
    --shadow: 0 1px 0 rgba(46,42,36,.08);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
  }

  h1,h2,h3,.display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  a{ color: inherit; }

  /* ---------- Header ---------- */
  header.site{
    padding: 3rem 1.5rem 2rem;
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .brand svg{ width: 40px; height: 40px; flex-shrink: 0; }
  .brand-text .display{ font-size: 1.9rem; line-height: 1; margin: 0; }
  .brand-text p{ margin: .3rem 0 0; color: var(--ink-soft); font-size: .95rem; }

  /* ---------- Shelf ---------- */
  main.shelf{
    max-width: 980px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }
  .shelf-intro{
    max-width: 46ch;
    margin: 0 0 2.5rem;
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.55;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 2rem 1.5rem;
  }
  .book{
    display: flex;
    flex-direction: column;
  }
  .cover-wrap{
    position: relative;
    aspect-ratio: 3 / 4.4;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--cream-deep);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .cover-wrap img{
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cover-wrap .no-cover{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size: 1rem; text-align:center; padding: 1rem;
    color: var(--ink-soft);
  }
  .book h3{
    font-size: 1.05rem;
    margin: .85rem 0 .15rem;
    line-height: 1.25;
  }
  .book .meta{
    font-size: .85rem;
    color: var(--ink-soft);
    margin: 0 0 .8rem;
  }
  .book-actions{
    display: flex;
    gap: .5rem;
    margin-top: auto;
  }
  .btn{
    font-family: 'Work Sans', sans-serif;
    font-size: .85rem;
    font-weight: 600;
    padding: .55rem .8rem;
    border-radius: 7px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    flex: 1;
    transition: background .15s ease, color .15s ease;
  }
  .btn:hover{ background: var(--ink); color: var(--cream); }
  .btn.primary{
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .btn.primary:hover{ background: #336a63; border-color: #336a63; }

  footer.site{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--ink-soft);
    font-size: .85rem;
  }

  /* ---------- Reader overlay ---------- */
  #reader-overlay{
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 100;
    display: none;
    flex-direction: column;
  }
  #reader-overlay.open{ display: flex; }

  .reader-topbar{
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--line);
    background: var(--cream);
    flex-wrap: wrap;
  }
  .reader-topbar .title-box{
    flex: 1;
    min-width: 120px;
  }
  .reader-topbar .title-box .t{
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn{
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 7px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .icon-btn:hover{ border-color: var(--ink); }
  .icon-btn.active{ background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .reader-body{
    position: relative;
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #toc-panel{
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--cream-deep);
    overflow-y: auto;
    padding: 1rem;
    display: none;
  }
  #toc-panel.open{ display: block; }
  #toc-panel h4{
    margin: 0 0 .75rem;
    font-size: .8rem;
    text-transform: none;
    color: var(--ink-soft);
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
  }
  #toc-panel ul{ list-style: none; margin: 0; padding: 0; }
  #toc-panel li a{
    display: block;
    padding: .45rem .3rem;
    font-size: .9rem;
    text-decoration: none;
    border-radius: 6px;
  }
  #toc-panel li a:hover{ background: rgba(0,0,0,.05); }

  #viewer-wrap{
    flex: 1;
    position: relative;
    display: flex;
    align-items: stretch;
  }
  #viewer{
    flex: 1;
    height: 100%;
  }

  .nav-zone{
    position: absolute;
    top: 0; bottom: 0;
    width: 15%;
    min-width: 44px;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 5;
  }
  .nav-zone.prev{ left: 0; }
  .nav-zone.next{ right: 0; }
  .nav-zone .arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .15s ease;
    font-size: .9rem;
  }
  .nav-zone.prev .arrow{ left: 8px; }
  .nav-zone.next .arrow{ right: 8px; }
  .nav-zone:hover .arrow{ opacity: 1; }

  .reader-loading{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    color: var(--ink-soft);
    background: var(--cream);
  }

  /* Night mode */
  body.night, #reader-overlay.night{
    --cream: #23211d;
    --cream-deep: #2c2a24;
    --ink: #efe6d6;
    --ink-soft: #a89f8d;
    --line: #454138;
  }

  @media (max-width: 640px){
    #toc-panel{ position: absolute; z-index: 20; height: 100%; box-shadow: 4px 0 12px rgba(0,0,0,.15); }
    .reader-topbar .t{ font-size: .9rem; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M10 14 L14 4 L20 12 Z" fill="var(--mustard)"/>
      <path d="M38 14 L34 4 L28 12 Z" fill="var(--mustard)"/>
      <rect x="8" y="12" width="32" height="28" rx="14" fill="var(--mustard)"/>
      <circle cx="17" cy="27" r="2.3" fill="var(--ink)"/>
      <circle cx="31" cy="27" r="2.3" fill="var(--ink)"/>
      <path d="M22 33 Q24 35 26 33" stroke="var(--ink)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <h1 class="display">Catbooks</h1>
      <p>Contes per a totes les edats</p>
    </div>
  </div>
</header>

<main class="shelf">
  <p class="shelf-intro">Gaudeix de la lectura!</p>
  <div class="grid" id="book-grid"></div>
</main>

<footer class="site">
  <p>Catbooks</p>
</footer>

<!-- ---------- Reader overlay ---------- -->
<div id="reader-overlay">
  <div class="reader-topbar">
    <button class="icon-btn" id="btn-close" title="Cerrar" aria-label="Cerrar lector">✕</button>
    <button class="icon-btn" id="btn-toc" title="Índice" aria-label="Mostrar índice">☰</button>
    <div class="title-box"><div class="t" id="reader-title">—</div></div>
    <button class="icon-btn" id="btn-font-minus" title="Letra más pequeña" aria-label="Reducir tamaño de letra">A−</button>
    <button class="icon-btn" id="btn-font-plus" title="Letra más grande" aria-label="Aumentar tamaño de letra">A+</button>
    <button class="icon-btn" id="btn-night" title="Modo noche" aria-label="Alternar modo noche">☾</button>
    <button class="icon-btn" id="btn-link" title="Copiar enlace directo a este libro" aria-label="Copiar enlace directo a este libro">🔗</button>
  </div>
  <div class="reader-body">
    <aside id="toc-panel">
      <h4>Índice</h4>
      <ul id="toc-list"></ul>
    </aside>
    <div id="viewer-wrap">
      <div class="reader-loading" id="reader-loading">Cargando libro…</div>
      <button class="nav-zone prev" id="btn-prev" aria-label="Página anterior"><span class="arrow">‹</span></button>
      <div id="viewer"></div>
      <button class="nav-zone next" id="btn-next" aria-label="Página siguiente"><span class="arrow">›</span></button>
    </div>
  </div>
</div>

<!-- epub.js -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<script>
/* =====================================================================
   CATÁLOGO DE LIBROS
   -------------------------------------------------------------------
   Ya está relleno con tus 7 títulos, tomados de tu repositorio
   (github.com/cyrusashborn-hue/Catbooks) y de tu web. Cada libro tiene
   además un "slug" (identificador corto en la URL) que sirve para
   enlazar directamente a ese libro en el lector: por ejemplo
   tu-lector.github.io/Catbooks/?libro=cuinamots abre el lector con
   "El cuinamots" ya cargado. Así, desde la descripción de cada cuento
   en tu web, puedes poner un botón "Leer en línea" que apunte
   directamente a ese enlace.

   Si algún día añades o cambias un libro, solo tienes que editar/añadir
   una entrada aquí, siguiendo el mismo patrón.
   ===================================================================== */
  const BOOKS = [
    {
      slug: "alegria-mixown",
      title: "L'alegria d'en Mixown",
      collection: "Catnap · a partir de 7 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/08/cover.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/L'alegria%20d'en%20Mixown_Catbooks.epub"
    },
    {
      slug: "mirall-del-cor",
      title: "El mirall del cor",
      collection: "Catnap · a partir de 7 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/08/portada.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/El%20mirall%20del%20cor_Catbooks.epub"
    },
    {
      slug: "troballa-ganil",
      title: "La troballa d'en Ganil",
      collection: "Catnap · a partir de 7 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/09/ganilprova2.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/La%20troballa%20d'en%20Ganil_Catbooks.epub"
    },
    {
      slug: "cuinamots",
      title: "El cuinamots",
      collection: "Catnap · a partir de 7 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/08/coverlabona.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/El%20cuinamots_Catbooks.epub"
    },
    {
      slug: "bruixa-bruna",
      title: "La bruixa Bruna",
      collection: "Catnip · a partir de 4 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/09/la-bruixa-bruna.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/La%20bruixa%20Bruna_Catbooks.epub"
    },
    {
      slug: "petita-puca-coixa",
      title: "La petita puça coixa",
      collection: "Catnip · a partir de 4 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/04/cover.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/La%20petita%20puc%CC%A7a%20coixa_Catbooks.epub"
    },
    {
      slug: "nit-sabana",
      title: "Nit a la sabana",
      collection: "Catnip · a partir de 4 anys",
      cover: "https://martacolomecontes.wordpress.com/wp-content/uploads/2026/09/cover-1.png",
      epub: "https://github.com/cyrusashborn-hue/Catbooks/raw/refs/heads/main/Nit%20a%20la%20sabana_Catbooks.epub"
    }
  ];
/* ===================================================================== */

  const grid = document.getElementById('book-grid');

  BOOKS.forEach((book, i) => {
    const card = document.createElement('div');
    card.className = 'book';
    card.id = 'libro-' + book.slug;
    card.innerHTML = `
      <div class="cover-wrap">
        <img src="${book.cover}" alt="Portada de ${book.title}"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'no-cover',textContent:'${book.title.replace(/'/g, "\\'")}'}))">
      </div>
      <h3>${book.title}</h3>
      <p class="meta">${book.collection || ''}</p>
      <div class="book-actions">
        <a class="btn" href="${book.epub}" download>Descargar</a>
        <button class="btn primary" data-index="${i}">Leer en línea</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-index]');
    if (!btn) return;
    openReader(BOOKS[Number(btn.dataset.index)]);
  });

  /* ---------------- Reader logic ---------------- */
  const overlay = document.getElementById('reader-overlay');
  const viewerEl = document.getElementById('viewer');
  const loadingEl = document.getElementById('reader-loading');
  const titleEl = document.getElementById('reader-title');
  const tocList = document.getElementById('toc-list');
  const tocPanel = document.getElementById('toc-panel');

  let book, rendition, fontSize = 100;

  function openReader(bookData){
    titleEl.textContent = bookData.title;
    overlay.classList.add('open');
    loadingEl.style.display = 'flex';
    tocPanel.classList.remove('open');
    document.body.style.overflow = 'hidden';

    if (book) { book.destroy(); }

    book = ePub(bookData.epub);
    rendition = book.renderTo(viewerEl, {
      width: '100%',
      height: '100%',
      spread: 'auto'
    });

    fontSize = 100;
    rendition.themes.fontSize(fontSize + '%');
    applyNightTheme();

    rendition.display().then(() => {
      loadingEl.style.display = 'none';
    });

    book.loaded.navigation.then(nav => {
      tocList.innerHTML = '';
      nav.toc.forEach(chapter => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = chapter.label.trim();
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          rendition.display(chapter.href);
          tocPanel.classList.remove('open');
        });
        li.appendChild(a);
        tocList.appendChild(li);
      });
    });
  }

  function closeReader(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  function applyNightTheme(){
    if (!rendition) return;
    rendition.themes.register('night', { body: { background: '#23211d', color: '#efe6d6' } });
    rendition.themes.register('day', { body: { background: '#ffffff', color: '#2e2a24' } });
    rendition.themes.select(overlay.classList.contains('night') ? 'night' : 'day');
  }

  document.getElementById('btn-close').addEventListener('click', closeReader);
  document.getElementById('btn-prev').addEventListener('click', () => rendition && rendition.prev());
  document.getElementById('btn-next').addEventListener('click', () => rendition && rendition.next());
  document.getElementById('btn-toc').addEventListener('click', () => tocPanel.classList.toggle('open'));

  document.getElementById('btn-font-plus').addEventListener('click', () => {
    fontSize = Math.min(fontSize + 10, 180);
    rendition && rendition.themes.fontSize(fontSize + '%');
  });
  document.getElementById('btn-font-minus').addEventListener('click', () => {
    fontSize = Math.max(fontSize - 10, 70);
    rendition && rendition.themes.fontSize(fontSize + '%');
  });

  document.getElementById('btn-night').addEventListener('click', (e) => {
    overlay.classList.toggle('night');
    e.target.classList.toggle('active');
    applyNightTheme();
  });

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'ArrowRight') rendition && rendition.next();
    if (e.key === 'ArrowLeft') rendition && rendition.prev();
    if (e.key === 'Escape') closeReader();
  });
</script>

</body>
</html>
