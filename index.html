<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catbooks - Lector en línia</title>

  <!-- Llibreries Epub.js i JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 1. TEMA CLAR */
    :root {
      --bg-body: #f4f6f8;
      --bg-header: #ffffff;
      --bg-viewer: #ffffff;
      --text-color: #222222;
      --border-color: #e1e8ed;
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-border: #cfd9de;
      --progress-bg: #e1e8ed;
      --progress-fill: #ff7b54;
    }

    /* 2. TEMA SÈPIA */
    body.sepia-mode {
      --bg-body: #f2e9d2;
      --bg-header: #e8dcbf;
      --bg-viewer: #fbf0d9;
      --text-color: #4a3b2c;
      --border-color: #decba5;
      --btn-bg: rgba(242, 233, 210, 0.9);
      --btn-border: #ccb68d;
      --progress-bg: #decba5;
      --progress-fill: #b56220;
    }

    /* 3. TEMA NIT */
    body.dark-mode {
      --bg-body: #121212;
      --bg-header: #1e1e1e;
      --bg-viewer: #1a1a1a;
      --text-color: #e4e6eb;
      --border-color: #333333;
      --btn-bg: rgba(40, 40, 40, 0.85);
      --btn-border: #444444;
      --progress-bg: #2a2a2a;
      --progress-fill: #ff9070;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      background: var(--bg-header);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      gap: 10px;
      z-index: 20;
      flex-shrink: 0;
      flex-wrap: wrap;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: transform 0.2s ease;
    }
    .brand-link:hover {
      transform: scale(1.05);
    }
    .brand-logo {
      height: 36px;
      width: auto;
      display: block;
      object-fit: contain;
      transition: filter 0.3s ease;
    }

    body.dark-mode .brand-logo {
      filter: invert(1) brightness(1.2);
    }

    #selector-llibre {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--btn-border);
      font-size: 0.9rem;
      background-color: var(--bg-header);
      color: var(--text-color);
      outline: none;
      cursor: pointer;
      max-width: 190px;
    }

    .tool-btn {
      background: var(--bg-header);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tool-btn:hover {
      background: var(--btn-bg);
      border-color: #ff7b54;
    }

    #viewer-container {
      flex: 1;
      min-height: 0;
      position: relative;
      margin: 8px;
      background: var(--bg-viewer);
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.25s ease;
    }

    #viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 15;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .nav-btn:hover {
      background: #ff7b54;
      color: #ffffff;
      border-color: #ff7b54;
    }
    #prev { left: 10px; }
    #next { right: 10px; }

    footer {
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: background-color 0.25s ease;
    }

    #progress-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      background: var(--progress-bg);
      outline: none;
      cursor: pointer;
      touch-action: pan-y;
    }

    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--progress-fill);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    #progress-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--progress-fill);
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    #progress-slider:active::-webkit-slider-thumb {
      transform: scale(1.25);
    }

    #progress-text {
      min-width: 42px;
      text-align: right;
      color: var(--text-color);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .nav-btn { width: 38px; height: 38px; font-size: 18px; opacity: 0.75; }
      #prev { left: 6px; }
      #next { right: 6px; }
      #viewer-container { margin: 4px; }
      #selector-llibre { max-width: 135px; font-size: 0.8rem; }
      .tool-btn { padding: 4px 7px; font-size: 0.8rem; }
      .brand-logo { height: 28px; }
      #progress-slider::-webkit-slider-thumb { width: 24px; height: 24px; }
    }

    #estat {
      position: absolute;
      font-size: 1rem;
      color: var(--text-color);
      text-align: center;
      padding: 20px;
      z-index: 5;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="https://martacolomecontes.wordpress.com/" target="_blank" rel="noopener" class="brand-link" title="Tornar a martacolomecontes.wordpress.com">
        <img src="logo1.png" alt="Catbooks" class="brand-logo">
      </a>
      <select id="selector-llibre"></select>
    </div>
    <div class="header-right">
      <button id="btn-font-dec" class="tool-btn" title="Fer lletra més petita">A−</button>
      <button id="btn-font-inc" class="tool-btn" title="Fer lletra més gran">A+</button>
      <button id="btn-tema" class="tool-btn" title="Canviar tema de lectura">☀️</button>
    </div>
  </header>

  <div id="viewer-container">
    <div id="estat">Connectant amb els contes...</div>
    <div id="viewer"></div>
    <button id="prev" class="nav-btn" aria-label="Anterior">‹</button>
    <button id="next" class="nav-btn" aria-label="Següent">›</button>
  </div>

  <footer>
    <input type="range" id="progress-slider" min="0" max="100" value="0" step="1" aria-label="Progrés de lectura">
    <span id="progress-text">0%</span>
  </footer>

  <script>
    const llibres = [
      { titol: "El cuinamots", fitxer: "el-cuinamots.epub", antic: "El cuinamots_Catbooks.epub" },
      { titol: "El mirall del cor", fitxer: "el-mirall-del-cor.epub", antic: "El mirall del cor_Catbooks.epub" },
      { titol: "L'alegria d'en Mixown", fitxer: "lalegria-den-mixown.epub", antic: "L'alegria d'en Mixown_Catbooks.epub" },
      { titol: "La bruixa Bruna", fitxer: "la-bruixa-bruna.epub", antic: "La bruixa Bruna_Catbooks.epub" },
      { titol: "La petita puça coixa", fitxer: "la-petita-puca-coixa.epub", antic: "La petita puça coixa_Catbooks.epub" },
      { titol: "La troballa d'en Ganil", fitxer: "la-troballa-den-ganil.epub", antic: "La troballa d'en Ganil_Catbooks.epub" },
      { titol: "Nit a la sabana", fitxer: "nit-a-la-sabana.epub", antic: "Nit a la sabana_Catbooks.epub" }
    ];

    const selector = document.getElementById('selector-llibre');
    const estat = document.getElementById('estat');
    const progressSlider = document.getElementById('progress-slider');
    const progressText = document.getElementById('progress-text');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnTema = document.getElementById('btn-tema');

    let llibreActual = null;
    let rendition = null;
    let midaLletra = 100;
    
    // CONTROL DELS TEMES: 'light' | 'sepia' | 'dark'
    let temaActual = 'light';

    const configuracionsTema = {
      light: {
        bg: '#ffffff',
        text: '#222222',
        link: '#ff7b54'
      },
      sepia: {
        bg: '#fbf0d9',
        text: '#4a3b2c',
        link: '#b56220'
      },
      dark: {
        bg: '#1a1a1a',
        text: '#e0e0e0',
        link: '#ff9070'
      }
    };

    function generarCssTema(tema) {
      const cfg = configuracionsTema[tema] || configuracionsTema.light;
      return `
        html, body {
          background-color: ${cfg.bg} !important;
          color: ${cfg.text} !important;
        }
        body {
          padding-bottom: 45px !important;
          box-sizing: border-box !important;
          -webkit-user-select: none !important;
          user-select: none !important;
          -webkit-touch-callout: none !important;
          column-fill: auto !important;
        }
        p { 
          margin-bottom: 0.7em !important; 
          color: ${cfg.text} !important;
        }
        h1, h2, h3, h4, h5, h6, span, div, li {
          color: inherit !important;
        }
        img { 
          max-height: 90vh !important; 
          object-fit: contain !important; 
        }
        a { 
          color: ${cfg.link} !important; 
          text-decoration: underline !important; 
          cursor: pointer !important; 
        }
      `;
    }

    // APLICA L'ESTIL DIRECTAMENT A L'IFRAME SENSE APILAR REGLAS CONFLICTIVES
    function aplicarEstilAContingut(doc) {
      if (!doc) return;
      let styleEl = doc.getElementById('catbooks-theme-style');
      if (!styleEl) {
        styleEl = doc.createElement('style');
        styleEl.id = 'catbooks-theme-style';
        doc.head.appendChild(styleEl);
      }
      styleEl.textContent = generarCssTema(temaActual);
    }

    function aplicarTema(nouTema) {
      temaActual = nouTema;
      document.body.classList.remove('dark-mode', 'sepia-mode');

      if (temaActual === 'dark') {
        document.body.classList.add('dark-mode');
        btnTema.textContent = '🌙';
        btnTema.title = 'Mode Nit (clic per passar a Clar)';
      } else if (temaActual === 'sepia') {
        document.body.classList.add('sepia-mode');
        btnTema.textContent = '📜';
        btnTema.title = 'Mode Sèpia (clic per passar a Nit)';
      } else {
        btnTema.textContent = '☀️';
        btnTema.title = 'Mode Clar (clic per passar a Sèpia)';
      }

      // Actualitzem els documents actius mitjançant l'API d'Epub.js
      if (rendition && typeof rendition.getContents === 'function') {
        rendition.getContents().forEach(c => {
          if (c && c.document) aplicarEstilAContingut(c.document);
        });
      }

      // Comprovació directa sobre els iframes del visualitzador
      const iframes = document.querySelectorAll('#viewer iframe');
      iframes.forEach(iframe => {
        try {
          const idoc = iframe.contentDocument || iframe.contentWindow.document;
          if (idoc) aplicarEstilAContingut(idoc);
        } catch (e) {}
      });

      const perc = parseInt(progressSlider.value, 10) || 0;
      actualitzarBarraVisual(perc);
    }

    // NAVEGACIÓ AMB DEBOUNCE TEMPORAL
    let navegant = false;
    let ultimToc = 0;

    async function passarPagina(direccio) {
      const ara = Date.now();
      if (navegant || (ara - ultimToc < 450) || !rendition) return;

      navegant = true;
      ultimToc = ara;

      try {
        if (direccio === 'next') {
          await rendition.next();
        } else if (direccio === 'prev') {
          await rendition.prev();
        }
      } catch (e) {
        console.warn(e);
      } finally {
        setTimeout(() => {
          navegant = false;
        }, 400);
      }
    }

    llibres.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.fitxer;
      opt.textContent = item.titol;
      selector.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const parametreLlibre = params.get('llibre') || params.get('libro');

    if (parametreLlibre) {
      const dec = decodeURIComponent(parametreLlibre).toLowerCase();
      const trobat = llibres.find(l => 
        l.fitxer.toLowerCase() === dec || 
        (l.antic && l.antic.toLowerCase() === dec) ||
        l.titol.toLowerCase() === dec
      );
      if (trobat) selector.value = trobat.fitxer;
    }

    function actualitzarBarraVisual(perc) {
      progressSlider.value = perc;
      progressText.textContent = `${perc}%`;
      progressSlider.style.background = `linear-gradient(to right, var(--progress-fill) 0%, var(--progress-fill) ${perc}%, var(--progress-bg) ${perc}%, var(--progress-bg) 100%)`;
    }

    async function obtenirArxiuBinari(llibreObj) {
      const nomsAProvar = [
        llibreObj.fitxer,
        llibreObj.antic,
        llibreObj.antic ? llibreObj.antic.normalize('NFD') : null,
        llibreObj.antic ? llibreObj.antic.normalize('NFC') : null
      ].filter(Boolean);

      const nomsUnics = [...new Set(nomsAProvar)];
      const urlsAProvar = [];

      for (const nom of nomsUnics) {
        urlsAProvar.push("https://raw.githubusercontent.com/cyrusashborn-hue/Catbooks/main/" + encodeURI(nom));
        urlsAProvar.push("https://raw.githubusercontent.com/cyrusashborn-hue/Catbooks/main/" + encodeURIComponent(nom));
      }

      for (const url of urlsAProvar) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.arrayBuffer();
        } catch (e) {}
      }
      throw new Error("No s'ha pogut connectar amb el fitxer.");
    }

    async function carregarLlibre(nomFitxer) {
      estat.style.display = 'block';
      estat.textContent = "Carregant conte...";
      actualitzarBarraVisual(0);

      if (rendition) { try { rendition.destroy(); } catch (e) {} }
      if (llibreActual) { try { llibreActual.destroy(); } catch (e) {} }
      document.getElementById('viewer').innerHTML = '';

      const llibreObj = llibres.find(l => l.fitxer === nomFitxer) || llibres[0];

      try {
        const dadesBinaries = await obtenirArxiuBinari(llibreObj);
        estat.textContent = "Preparant la lectura...";

        llibreActual = ePub();
        await llibreActual.open(dadesBinaries, "binary");

        const esMobil = window.innerWidth < 768;

        rendition = llibreActual.renderTo("viewer", {
          width: "100%",
          height: "100%",
          spread: esMobil ? "none" : "auto",
          flow: "paginated"
        });

        rendition.themes.fontSize(`${midaLletra}%`);

        // GESTIÓ D'ENLLAÇOS, ESTILS I SWIPE
        rendition.hooks.content.register(function(contents) {
          
          // Aplica el tema actiu a cada pàgina que es carrega
          aplicarEstilAContingut(contents.document);

          // Enllaços
          const links = contents.document.querySelectorAll('a[href]');
          links.forEach(link => {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();

              const href = link.getAttribute('href');
              if (!href) return;

              if (/^(https?:|mailto:|tel:)/i.test(href)) {
                window.open(href, '_blank', 'noopener,noreferrer');
                return;
              }

              if (href.startsWith('#')) {
                const elem = contents.document.querySelector(href) || contents.document.getElementById(href.slice(1));
                if (elem) {
                  const cfi = contents.cfiFromElement(elem);
                  if (cfi) {
                    rendition.display(cfi);
                    return;
                  }
                }
                rendition.display(contents.section.href + href);
              } else {
                rendition.display(href);
              }
            });
          });

          // Swipe tàctil
          let touchStartX = 0;
          let touchStartY = 0;
          let touchStartTime = 0;

          contents.document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
              touchStartX = e.touches[0].clientX;
              touchStartY = e.touches[0].clientY;
              touchStartTime = Date.now();
            }
          }, { passive: true });

          contents.document.addEventListener('touchend', (e) => {
            if (e.target.closest('a')) return;

            if (e.changedTouches.length > 0) {
              const deltaX = e.changedTouches[0].clientX - touchStartX;
              const deltaY = e.changedTouches[0].clientY - touchStartY;
              const deltaTime = Date.now() - touchStartTime;

              if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3 && deltaTime < 550) {
                passarPagina(deltaX < 0 ? 'next' : 'prev');
              }
            }
          }, { passive: true });
        });

        rendition.on("relocated", (location) => {
          if (llibreActual.locations && llibreActual.locations.total > 0) {
            const perc = Math.round(llibreActual.locations.percentageFromCfi(location.start.cfi) * 100);
            actualitzarBarraVisual(perc);
          }
        });

        await rendition.display();
        estat.style.display = 'none';

        llibreActual.ready.then(() => {
          return llibreActual.locations.generate(600);
        }).then(() => {
          const loc = rendition.currentLocation();
          if (loc && loc.start) {
            const perc = Math.round(llibreActual.locations.percentageFromCfi(loc.start.cfi) * 100);
            actualitzarBarraVisual(perc);
          }
        });

      } catch (error) {
        console.error(error);
        estat.innerHTML = "<strong>No s'ha pogut carregar el conte.</strong><br><small style='color:#c00;'>" + error.message + "</small>";
      }
    }

    progressSlider.addEventListener('input', (e) => {
      const perc = parseInt(e.target.value, 10);
      actualitzarBarraVisual(perc);
    });

    progressSlider.addEventListener('change', (e) => {
      const perc = parseInt(e.target.value, 10);
      if (!llibreActual || !rendition) return;

      if (perc <= 0) {
        if (llibreActual.spine && llibreActual.spine.first()) {
          rendition.display(llibreActual.spine.first().href);
        } else {
          rendition.display(0);
        }
        return;
      }

      if (perc >= 100) {
        if (llibreActual.spine && llibreActual.spine.last()) {
          rendition.display(llibreActual.spine.last().href);
        }
        return;
      }

      if (llibreActual.locations && llibreActual.locations.total > 0) {
        const cfi = llibreActual.locations.cfiFromPercentage(perc / 100);
        if (cfi) rendition.display(cfi);
      }
    });

    document.getElementById('btn-font-inc').addEventListener('click', () => {
      if (midaLletra < 180) {
        midaLletra += 15;
        if (rendition) rendition.themes.fontSize(`${midaLletra}%`);
      }
    });

    document.getElementById('btn-font-dec').addEventListener('click', () => {
      if (midaLletra > 70) {
        midaLletra -= 15;
        if (rendition) rendition.themes.fontSize(`${midaLletra}%`);
      }
    });

    // CANVI CÍCLIC DE TEMA: Clar -> Sèpia -> Nit -> Clar...
    btnTema.addEventListener('click', () => {
      if (temaActual === 'light') {
        aplicarTema('sepia');
      } else if (temaActual === 'sepia') {
        aplicarTema('dark');
      } else {
        aplicarTema('light');
      }
    });

    window.addEventListener('resize', () => {
      if (rendition) rendition.resize();
    });

    carregarLlibre(selector.value);
    selector.addEventListener('change', (e) => carregarLlibre(e.target.value));

    // NAVEGACIÓ PER BOTONS
    btnPrev.addEventListener('click', (e) => {
      e.preventDefault();
      passarPagina('prev');
    });
    
    btnNext.addEventListener('click', (e) => {
      e.preventDefault();
      passarPagina('next');
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') passarPagina('prev');
      if (e.key === 'ArrowRight') passarPagina('next');
    });
  </script>
</body>
</html>
